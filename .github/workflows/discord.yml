name: Discord Notify

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Embed
        run: |
          FILES=$(jq -r '.commits[].modified[], .commits[].added[], .commits[].removed[]?' "$GITHUB_EVENT_PATH" | sort | uniq | head -n 10)

          ADDED=$(jq '[.commits[].added[]?] | length' "$GITHUB_EVENT_PATH")
          REMOVED=$(jq '[.commits[].removed[]?] | length' "$GITHUB_EVENT_PATH")
          MODIFIED=$(jq '[.commits[].modified[]?] | length' "$GITHUB_EVENT_PATH")

          TOTAL_PLUS=$(jq '[.commits[].added[]?] | length' "$GITHUB_EVENT_PATH")
          TOTAL_MINUS=$(jq '[.commits[].removed[]?] | length' "$GITHUB_EVENT_PATH")

          curl -H "Content-Type: application/json" \
          -X POST \
          -d "{
            \"embeds\": [{
              \"title\": \"🚀 New Push to ${{ github.repository }}\",
              \"url\": \"${{ github.event.head_commit.url }}\",
              \"color\": 5814783,
              \"author\": {
                \"name\": \"${{ github.actor }}\",
                \"icon_url\": \"https://github.com/${{ github.actor }}.png\"
              },
              \"fields\": [
                {
                  \"name\": \"📌 Branch\",
                  \"value\": \"\`${{ github.ref_name }}\`\",
                  \"inline\": true
                },
                {
                  \"name\": \"📊 Changes\",
                  \"value\": \"+${TOTAL_PLUS} / -${TOTAL_MINUS}\",
                  \"inline\": true
                },
                {
                  \"name\": \"📁 Files Changed\",
                  \"value\": \"$(echo \"$FILES\" | sed 's/^/- /' | tr '\n' '\\n')\"
                },
                {
                  \"name\": \"💬 Commit Message\",
                  \"value\": \"${{ github.event.head_commit.message }}\"
                }
              ],
              \"footer\": {
                \"text\": \"GitHub • Push Event\"
              },
              \"timestamp\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"
            }]
          }" \
          ${{ secrets.DISCORD_WEBHOOK_URL }}
