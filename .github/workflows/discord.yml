name: Discord Advanced Notify

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch commit data
        run: |
          SHA=$(jq -r '.head_commit.id' "$GITHUB_EVENT_PATH")

          RESPONSE=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/commits/$SHA)

          # Total stats
          PLUS=$(echo "$RESPONSE" | jq '.stats.additions')
          MINUS=$(echo "$RESPONSE" | jq '.stats.deletions')

          # File list with per-file stats
          FILES=$(echo "$RESPONSE" | jq -r '
            .files[] |
            "- \(.filename) (+\(.additions) / -\(.deletions))"
          ' | head -n 10)

          # Diff preview (trimmed)
          DIFF=$(echo "$RESPONSE" | jq -r '
            .files[]?.patch // empty
          ' | head -n 20)

          # Save to env
          echo "PLUS=$PLUS" >> $GITHUB_ENV
          echo "MINUS=$MINUS" >> $GITHUB_ENV

          echo "FILES<<EOF" >> $GITHUB_ENV
          echo "$FILES" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

          echo "DIFF<<EOF" >> $GITHUB_ENV
          echo "$DIFF" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Send Discord embed
        run: |
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg url "${{ github.event.head_commit.url }}" \
            --arg actor "${{ github.actor }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg msg "${{ github.event.head_commit.message }}" \
            --arg plus "${{ env.PLUS }}" \
            --arg minus "${{ env.MINUS }}" \
            --arg files "${{ env.FILES }}" \
            --arg diff "${{ env.DIFF }}" \
          '{
            embeds: [{
              title: ("📦 " + $repo),
              url: $url,
              color: 3066993,
              author: {
                name: $actor,
                icon_url: ("https://github.com/" + $actor + ".png")
              },
              description: ("**" + $msg + "**"),
              fields: [
                {
                  name: "🌿 Branch",
                  value: ("`" + $branch + "`"),
                  inline: true
                },
                {
                  name: "📊 Changes",
                  value: ("🟢 +" + $plus + " 🔴 -" + $minus),
                  inline: true
                },
                {
                  name: "📁 Files",
                  value: $files
                },
                {
                  name: "🧾 Diff Preview",
                  value: ("```diff\n" + $diff + "\n```")
                }
              ],
              footer: {
                text: "GitHub • Commit"
              },
              timestamp: (now | todateiso8601)
            }]
          }' > payload.json

          curl -H "Content-Type: application/json" \
               -X POST \
               -d @payload.json \
               ${{ secrets.DISCORD_WEBHOOK_URL }}
