name: Discord Notify

on:
  push:
    branches:
      - main

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Build and send Discord embed
        run: |
          # Get changed files safely (limit 10)
          FILES=$(jq -r '
            .commits[]? 
            | (.modified // []), (.added // []), (.removed // [])
            | .[]
          ' "$GITHUB_EVENT_PATH" | sort | uniq | head -n 10)

          # Count additions/removals safely
          TOTAL_PLUS=$(jq '[.commits[]? | (.added // [])[]] | length' "$GITHUB_EVENT_PATH")
          TOTAL_MINUS=$(jq '[.commits[]? | (.removed // [])[]] | length' "$GITHUB_EVENT_PATH")

          # Format file list safely
          FILE_LIST=$(echo "$FILES" | sed 's/^/- /' | jq -Rs .)

          # Safe commit message (handles quotes/newlines)
          COMMIT_MSG=$(jq -r '.head_commit.message // "No commit message"' "$GITHUB_EVENT_PATH" | jq -Rs .)

          # Build payload JSON safely
          jq -n \
            --arg repo "${{ github.repository }}" \
            --arg url "${{ github.event.head_commit.url }}" \
            --arg actor "${{ github.actor }}" \
            --arg branch "${{ github.ref_name }}" \
            --arg files "$FILE_LIST" \
            --arg msg "$COMMIT_MSG" \
            --arg plus "$TOTAL_PLUS" \
            --arg minus "$TOTAL_MINUS" \
          '{
            embeds: [{
              title: ("🚀 New Push to " + $repo),
              url: $url,
              color: 5814783,
              author: {
                name: $actor,
                icon_url: ("https://github.com/" + $actor + ".png")
              },
              fields: [
                {
                  name: "📌 Branch",
                  value: ("`" + $branch + "`"),
                  inline: true
                },
                {
                  name: "📊 Changes",
                  value: ("+" + $plus + " / -" + $minus),
                  inline: true
                },
                {
                  name: "📁 Files Changed",
                  value: ($files | fromjson | select(length > 0) // "No files detected")
                },
                {
                  name: "💬 Commit Message",
                  value: ($msg | fromjson)
                }
              ],
              footer: {
                text: "GitHub • Push Event"
              },
              timestamp: (now | todateiso8601)
            }]
          }' > payload.json

          # Send to Discord (shows HTTP status for debug)
          curl -s -o /dev/null -w "HTTP %{http_code}\n" \
            -H "Content-Type: application/json" \
            -X POST \
            -d @payload.json \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
